apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookshelf-backend-broken-auth
  namespace: bookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookshelf-broken
  template:
    metadata:
      labels:
        app: bookshelf-broken
    spec:
      containers:
        - name: backend
          image: ghcr.io/armandevops/bookshelf-backend:latest
          env:
            - name: DB_HOST
              value: "bookshelf-db"
            - name: DB_NAME
              value: "bookshelf"
            - name: DB_USER
              value: "bookshelf"
            - name: DB_PASSWORD
              value: "WRONG_INVALID_PASSWORD_12345" # <-- CAUSES CrashLoopBackOff!
          ports:
            - containerPort: 8000
