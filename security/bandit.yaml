# ===================================================
# Bandit SAST Configuration
# ===================================================

# Profile configuration for Python Static Analysis
profiles:
  default:
    include:
      - any_other_function_with_shell_equals_true
      - assert_used
      - hardcoded_password_string
      - hardcoded_tmp_directory
      - jinja2_autoescape_false
      - paramiko_calls
      - sql_statements
      - subprocess_popen_with_shell_equals_true

# Exclude test files from security rules (asserts are normal in tests)
exclude_dirs:
  - tests
  - alembic/versions
  - .venv
