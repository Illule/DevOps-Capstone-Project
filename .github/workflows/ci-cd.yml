# ===================================================
# BookShelf CI/CD Pipeline
# ===================================================
# Triggers: push to main, pull requests, manual dispatch
#
# Pipeline flow:
#   1. Backend: lint → test
#   2. Frontend: lint → build
#   3. Security: SAST, SCA, secret scanning
#   4. Docker: build images → Trivy scan → push to GHCR
#   5. GitOps: update image tags in Helm values

name: BookShelf CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/bookshelf-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/bookshelf-frontend

permissions:
  contents: read

jobs:
  # -----------------------------------------------
  # Job 1: Backend Lint & Test
  # -----------------------------------------------
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check .
          ruff format --check .

      - name: Run pytest
        run: |
          cd backend
          pytest -v --tb=short

  # -----------------------------------------------
  # Job 2: Frontend Lint & Build
  # -----------------------------------------------
  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Build production bundle
        run: |
          cd frontend
          npm run build

  # -----------------------------------------------
  # Job 3: Security Scanning (SAST, SCA, Secrets)
  # -----------------------------------------------
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      - name: SAST — Bandit (Python security linter)
        run: |
          cd backend
          bandit -r app/ -f json -o ../bandit-report.json --severity-level medium || true
          bandit -r app/ --severity-level high

      - name: SCA — pip-audit (dependency vulnerabilities)
        run: |
          cd backend
          pip install -r requirements.txt
          pip-audit --strict

      - name: Secret Scanning — Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------
  # Job 4: Build, Scan & Push Docker Images
  # -----------------------------------------------
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend Image ---
      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scan — Backend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          timeout: 10m

      - name: Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha

      # --- Frontend Image ---
      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scan — Frontend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          timeout: 10m

      - name: Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha

  # -----------------------------------------------
  # Job 5: Update GitOps Image Tags
  # -----------------------------------------------
  update-gitops:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm values with new image tags
        run: |
          cd helm/bookshelf
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|g" values-prod.yaml
          echo "Updated image tags to ${{ github.sha }}"
          cat values-prod.yaml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/bookshelf/values-prod.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push
