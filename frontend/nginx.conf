# Nginx configuration for BookShelf frontend
#
# Routes:
#   /       → serves the React SPA static files
#   /api/*  → proxies to the backend service
#
# The proxy_pass target changes depending on environment:
#   - Docker Compose: http://backend:8000
#   - Kubernetes: handled by Ingress (no proxy needed)

server {
    listen 80;
    server_name localhost;

    # Serve React SPA
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # For client-side routing: serve index.html for all unknown paths
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
