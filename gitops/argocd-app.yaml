apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookshelf
  namespace: argocd
  labels:
    app.kubernetes.io/name: bookshelf
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/armandevops/DevOps-Capstone-Project.git
    targetRevision: HEAD
    path: helm/bookshelf
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: bookshelf
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
