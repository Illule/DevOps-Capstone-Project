apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bookshelf.fullname" . }}-secret
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "bookshelf.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.database.password | default "postgres" | quote }}
