apiVersion: v1
kind: ConfigMap
metadata:
  name: bookshelf-config
  namespace: bookshelf
  labels:
    app.kubernetes.io/name: bookshelf
    app.kubernetes.io/part-of: bookshelf
data:
  APP_NAME: "BookShelf"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  CORS_ORIGINS: "*"
  DB_HOST: "bookshelf-db"
  DB_PORT: "5432"
  DB_NAME: "bookshelf"
  DB_USER: "bookshelf"
